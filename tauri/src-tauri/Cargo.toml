[package]
name = "orbi-tauri"
version = "3.1.0"
edition = "2021"
description = "Orbi: o notch do Windows (motor em Rust, tela em web pelo Tauri)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }

[features]
# Com a feature, o `cargo build --release` embute a pasta ui/ no .exe (sem precisar do tauri-cli).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
