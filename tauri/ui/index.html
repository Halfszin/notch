<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Orbi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- O notch: mesmo desenho do Orbi em Slint (fechado, aviso e aberto com as páginas). -->
  <div id="pill">
    <!-- fechado no topo: anel + barrinhas + hora -->
    <div id="closed-top" class="closed">
      <span class="rings"></span>
      <span id="barsbox"><span class="bars" id="closed-bars"></span></span>
      <span class="ctext" id="closed-text"></span>
    </div>
    <!-- fechado nas laterais: em pé -->
    <div id="closed-side" class="closed">
      <span class="rings"></span>
      <span class="bars" id="side-bars"></span>
      <span class="ctext" id="side-text"></span>
    </div>

    <!-- aviso rápido -->
    <div id="toast"><span id="toast-icon"></span><span id="toast-text"></span></div>

    <!-- aberto -->
    <div id="open">
      <header>
        <div id="title"></div>
        <div id="when">
          <span class="rings"></span>
          <span id="weather"><span id="weather-glyph"></span><span id="weather-text"></span></span>
          <span id="date"></span>
          <b id="clock"></b>
        </div>
        <div id="tools">
          <span class="bars anim" id="head-bars"><i></i><i></i><i></i><i></i></span>
          <button class="tool" id="chat-btn" title="Claude"><svg viewBox="0 0 256 257"><use href="#claude"/></svg></button>
          <button class="tool icon" id="game-btn" title="Modo jogo">&#xE7FC;</button>
          <button class="tool icon" id="gear-btn" title="Configurações">&#xE713;</button>
          <button class="tool icon" id="quit-btn" title="Fechar">&#xE711;</button>
        </div>
      </header>

      <section id="content">
        <!-- 0: música -->
        <div class="page" id="p0">
          <div class="avatar" id="avatar"></div>
          <div id="player">
            <div class="song-row">
              <div id="cover"><img alt=""><span class="icon">&#xE8D6;</span></div>
              <div class="song-text"><b id="song"></b><span id="artist"></span></div>
            </div>
            <div class="progress-row">
              <span id="elapsed"></span>
              <div class="track"><div id="progress"></div></div>
              <span id="remaining"></span>
            </div>
            <div class="controls">
              <div class="side l"><button class="ibtn icon" id="lyr-btn">&#xE8BD;</button></div>
              <button class="ibtn icon" id="prev-btn">&#xE892;</button>
              <button class="ibtn icon big" id="play-btn"></button>
              <button class="ibtn icon" id="next-btn">&#xE893;</button>
              <div class="side r">
                <div id="volume"><span class="icon" id="vol-icon"></span><i class="vtrack"></i><i class="vfill"></i><i class="vknob"></i></div>
              </div>
            </div>
          </div>
          <div id="lyrics">
            <span class="sep"></span>
            <div class="lines"><span id="ly-prev"></span><b id="ly-now"></b><span id="ly-next"></span><span id="ly-next2"></span></div>
          </div>
        </div>

        <!-- 1: tarefas -->
        <div class="page" id="p1">
          <div class="tasks-left">
            <div id="tasks-count"></div>
            <div class="muted13">feitas hoje</div>
            <div style="height:8px"></div>
            <div id="task-buttons" class="row8">
              <button class="pill" id="task-add"><span class="icon">&#xE710;</span>Adicionar</button>
              <button class="pill" id="task-clear"><span class="icon">&#xE74D;</span>Limpar</button>
            </div>
            <input id="task-input" class="line" placeholder="Nova tarefa… (Enter salva)">
          </div>
          <div class="scroll" id="task-list"></div>
        </div>

        <!-- 2: foco -->
        <div class="page" id="p2">
          <div id="focus-text"></div>
          <div class="row8 center">
            <button class="pill primary" id="focus-toggle"></button>
            <button class="pill" id="focus-reset"><span class="icon">&#xE72C;</span>Zerar</button>
          </div>
          <div class="row6 center" id="presets"></div>
        </div>

        <!-- 3: calendário -->
        <div class="page" id="p3">
          <div class="cal-head"><b id="month-name"></b><button class="ibtn icon small" id="month-prev">&#xE76B;</button><button class="ibtn icon small" id="month-next">&#xE76C;</button></div>
          <div id="cal"></div>
        </div>

        <!-- 4: notas -->
        <div class="page" id="p4">
          <textarea id="notes" placeholder="Anote algo rápido… (salva sozinho)"></textarea>
        </div>

        <!-- 5: copiados -->
        <div class="page" id="p5">
          <div class="clip-head"><span id="clip-hint"></span><span id="clip-clear">Limpar</span></div>
          <div class="scroll" id="clip-list"></div>
        </div>

        <!-- 6: sistema -->
        <div class="page" id="p6">
          <div id="gauges"></div>
          <div class="audio-dev"><span class="icon">&#xE7F6;</span><span id="audio-device"></span></div>
        </div>

        <!-- 7: atalhos -->
        <div class="page scroll" id="p7">
          <div id="sc-add" class="row8">
            <button class="pill" id="sc-file"><span class="icon">&#xE7AC;</span>App ou arquivo</button>
            <button class="pill" id="sc-folder"><span class="icon">&#xE8B7;</span>Pasta</button>
            <input id="sc-site" class="line" placeholder="site (ex.: youtube.com)">
            <button class="ibtn icon small" id="sc-cancel">&#xE711;</button>
          </div>
          <div id="sc-grid"></div>
        </div>

        <!-- 8: agentes -->
        <div class="page" id="p8">
          <div id="perm">
            <div class="perm-head"><span class="icon">&#xE72E;</span><b id="perm-what"></b><span id="perm-project"></span></div>
            <div id="perm-code"></div>
            <div class="row8 end">
              <button class="pill" data-perm="deny"><span class="icon">&#xE711;</span>Negar</button>
              <button class="pill" data-perm="always"><span class="icon">&#xE8FB;</span>Sempre</button>
              <button class="pill primary" data-perm="allow"><span class="icon">&#xE73E;</span>Permitir</button>
            </div>
          </div>
          <div id="agents-empty"><b></b><span></span></div>
          <div class="scroll" id="agent-list"></div>
          <div id="plan"></div>
        </div>

        <!-- chat com o Claude -->
        <div class="page" id="chat">
          <div class="scroll" id="chat-list"></div>
          <div id="chat-box">
            <input id="chat-input" placeholder="Como posso ajudar?">
            <button id="chat-trash" title="Limpar a conversa"><img src="icons/lixeira.png" alt=""></button>
            <button id="chat-send" title="Enviar"><img src="icons/enviar.png" alt=""></button>
          </div>
        </div>
      </section>

      <div id="dots"></div>
    </div>

    <button class="arrow" id="arrow-l"><svg viewBox="0 0 24 24"><path d="M15 6L10.273 10.727A1.8 1.8 0 0 0 10.273 13.273L15 18"/></svg></button>
    <button class="arrow" id="arrow-r"><svg viewBox="0 0 24 24"><path d="M9 6L13.727 10.727A1.8 1.8 0 0 1 13.727 13.273L9 18"/></svg></button>
  </div>

  <!-- Logo do Claude (vetor enviado pelo dono) e o degradê das setas "de vidro". -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>

    </defs>
  </svg>
  <script src="avatar.js"></script>
  <script src="main.js"></script>
</body>
</html>
