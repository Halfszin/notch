name: rust

on:
  push:
    branches: [main]
    paths: ["rust/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: write

# Um teste por vez: um push no meio espera o anterior publicar a prévia, sem um sobrescrever o outro fora de ordem.
concurrency:
  group: rust-preview
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      # Guarda as dependências já compiladas entre um teste e outro (sem isso o Rust compila tudo do zero).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Testes
        run: cargo test --release

      - name: Compilar
        env:
          ORBI_BUILD: ${{ github.sha }}  # o atualizador compara com o versao.txt da prévia
        run: cargo build --release

      - name: Abrir o Orbi (Rust) e tirar prints
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory ci -Force | Out-Null
          function Shot($name) {
            Write-Host "print: $name ($([int]((Get-Date) - $inicio).TotalSeconds) s)"
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("ci\$name.png")
          }
          # Roda uma cópia: o atualizador troca o .exe aberto pelo da prévia, e o publicado tem de ser o compilado aqui.
          New-Item -ItemType Directory run -Force | Out-Null
          Copy-Item target\release\orbi.exe run\orbi.exe
          $exe = "run\orbi.exe"
          $inicio = Get-Date
          Write-Host "começou"
          "tamanho=$([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB" | Out-File ci\resultado.txt
          # Tarefas de exemplo (mesmo arquivo do Orbi em C#): 4 de 5 feitas.
          New-Item -ItemType Directory "$env:APPDATA\Orbi" -Force | Out-Null
          '[{"Title":"Revisar o relatorio","Done":true},{"Title":"Responder a Dina","Done":true},{"Title":"Postar a atualizacao","Done":true},{"Title":"Ligar pro banco","Done":true},{"Title":"Comprar pao","Due":"2026-11-25T18:00:00","Done":false}]' | Set-Content "$env:APPDATA\Orbi\tarefas.json" -Encoding utf8
          '[{"Name":"Bloco de notas","Target":"C:\\Windows\\System32\\notepad.exe"},{"Name":"github.com","Target":"https://github.com/"},{"Name":"Windows","Target":"C:\\Windows"}]' | Set-Content "$env:APPDATA\Orbi\atalhos.json" -Encoding utf8
          Add-Type -Namespace W -Name M -MemberDefinition '[DllImport("user32.dll")] public static extern void mouse_event(uint f, int x, int y, int d, System.UIntPtr e);'
          Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices;
          namespace W { public static class Win {
            delegate bool Cb(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(Cb cb, IntPtr l);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            public static void CloseAll(int pid) { EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p); if (p == pid) PostMessage(h, 0x10, IntPtr.Zero, IntPtr.Zero); return true; }, IntPtr.Zero); }
          } }
          "@
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 900, 700
          # Letra de verdade no LRCLIB (com e sem álbum): o notch mostra a letra da música tocando.
          Start-Process $exe -ArgumentList "--testar-letra" -Wait
          Get-Content "$env:APPDATA\Orbi\rust-letra.txt" | Out-File ci\resultado.txt -Append
          try { $r = Invoke-WebRequest "https://lrclib.net/api/search?track_name=Yellow&artist_name=Coldplay" -UseBasicParsing; "pwsh_lrclib=$($r.StatusCode) $($r.Content.Length)" | Out-File ci\resultado.txt -Append } catch { "pwsh_lrclib_erro=$_" | Out-File ci\resultado.txt -Append }
          # Clima de uma cidade (o Orbi completa o resto do arquivo ao abrir).
          '{"city":"São Paulo, Brasil","lat":-23.55,"lon":-46.63}' | Set-Content "$env:APPDATA\Orbi\rust-config.json" -Encoding utf8
          "portas_4783x_antes=$((Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -ge 47821 -and $_.LocalPort -le 47845 } | ForEach-Object { "$($_.LocalAddress):$($_.LocalPort)" }) -join ' ')" | Out-File ci\resultado.txt -Append
          Write-Host "letra ok; abrindo o Orbi (ORBI_SEM_AGENTES=$env:ORBI_SEM_AGENTES)"
          # --startup: abre como ao ligar o PC (só o notch, sem a tela de configurações).
          $p = Start-Process $exe -ArgumentList "--startup" -PassThru
          Start-Sleep 6
          Shot "1-fechado"
          $w = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point ([int]($w / 2)), 10
          Start-Sleep 2
          Shot "2-aberto"
          # Volume: o mouse em cima do alto-falante (à direita dos botões de tocar) abre a barrinha.
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point ([int](($w - 620) / 2 + 46 + 156 + 280)), 175
          Start-Sleep 1
          Shot "2b-volume"
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point ([int]($w / 2)), 10
          Start-Sleep 1
          # Rodinha do mouse para baixo = próxima página.
          foreach ($name in "3-tarefas", "4-foco") {
            [W.M]::mouse_event(0x0800, 0, 0, -120, [System.UIntPtr]::Zero)
            Start-Sleep 1
            Shot $name
          }
          # Clique de verdade na seta da esquerda: de Foco deve voltar para Tarefas.
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point ([int](($w - 620) / 2 + 22)), 131
          Start-Sleep -Milliseconds 400
          [W.M]::mouse_event(0x0002, 0, 0, 0, [System.UIntPtr]::Zero)
          [W.M]::mouse_event(0x0004, 0, 0, 0, [System.UIntPtr]::Zero)
          Start-Sleep 1
          Shot "5-depois-do-clique"
          # Páginas novas (leva 1): Foco → Calendário → Notas → Copiados → Sistema → Atalhos.
          Set-Clipboard -Value "Texto copiado no teste do CI"
          foreach ($name in "6-foco", "7-calendario", "8-notas", "9-copiados") {
            [W.M]::mouse_event(0x0800, 0, 0, -120, [System.UIntPtr]::Zero)
            Start-Sleep 1
            Shot $name
          }
          # Diagnóstico: depois de Copiados a rodinha parou no teste anterior. Uma rodada de rodinha
          # parado no topo, depois clique na seta da direita, depois rodinha de novo.
          [W.M]::mouse_event(0x0800, 0, 0, -120, [System.UIntPtr]::Zero)
          Start-Sleep 1
          Shot "10-roda-em-copiados"
          function Click($x, $y) {
            [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point ([int]$x), ([int]$y)
            Start-Sleep -Milliseconds 400
            [W.M]::mouse_event(0x0002, 0, 0, 0, [System.UIntPtr]::Zero)
            [W.M]::mouse_event(0x0004, 0, 0, 0, [System.UIntPtr]::Zero)
            Start-Sleep 1
          }
          Click (($w + 620) / 2 - 22) 131
          Shot "11-seta-direita"
          [W.M]::mouse_event(0x0800, 0, 0, -120, [System.UIntPtr]::Zero)
          Start-Sleep 1
          Shot "12-roda-de-novo"
          # Engrenagem (ao lado do X) abre as configurações.
          Click (($w + 620) / 2 - 91) 22
          Start-Sleep 1
          Shot "13-configuracoes"
          # Fechar e abrir de novo pela engrenagem (antes não reabria). Fecha mandando "fechar" para as janelas
          # do Orbi (o notch ignora; as configurações fecham). Alt+F4 fechava a janela em foco, que às vezes era a
          # do próprio GitHub, e a máquina do teste caía.
          [W.Win]::CloseAll($p.Id)
          Start-Sleep 1
          Shot "13a-fechada"
          Click (($w + 620) / 2 - 91) 22
          Start-Sleep 1
          Shot "13b-reaberta"
          "vivo=$(-not $p.HasExited)" | Out-File ci\resultado.txt -Append
          # Atualizador: 20 s depois de abrir compara com o versao.txt da prévia (outro commit) e troca o .exe.
          for ($i = 0; $i -lt 40 -and -not (Test-Path run\orbi.exe.old); $i++) { Start-Sleep 2 }
          "atualizou=$(Test-Path run\orbi.exe.old)" | Out-File ci\resultado.txt -Append
          # Abrir o app de novo não cria outro notch: só mostra as configurações do que já está aberto.
          $p2 = Start-Process target\release\orbi.exe -PassThru
          Start-Sleep 3
          "segunda_copia_fechou=$($p2.HasExited)" | Out-File ci\resultado.txt -Append
          Shot "15-segunda-copia"
          # Chat do Claude: ícone laranja do Claude no topo (ao lado do controle do modo jogo).
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point ([int]($w / 2)), 10
          Start-Sleep 2
          Click (($w + 620) / 2 - 155) 22
          Shot "23-chat"
          Click (($w + 620) / 2 - 155) 22
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 900, 700
          Start-Sleep 1
          # Agentes do Claude Code: manda eventos como os hooks mandariam (curl com o código secreto).
          $cfg = Get-Content "$env:APPDATA\Orbi\rust-config.json" -Raw | ConvertFrom-Json
          $base = "http://127.0.0.1:$($cfg.agent_port)/$($cfg.agent_token)"
          '{"session_id":"s1","cwd":"C:\\proj\\meu-app","tool_name":"Edit","tool_input":{"file_path":"C:\\proj\\meu-app\\main.rs"}}' | Set-Content "$env:TEMP\pre.json" -Encoding ascii
          '{"session_id":"s1","cwd":"C:\\proj\\meu-app","tool_name":"Bash","tool_input":{"command":"cargo build --release"},"permission_suggestions":[]}' | Set-Content "$env:TEMP\perm.json" -Encoding ascii
          "agente_codigo_errado=$(curl.exe -s -o NUL -w '%{http_code}' --data-binary "@$env:TEMP\pre.json" "http://127.0.0.1:$($cfg.agent_port)/errado/PreToolUse")" | Out-File ci\resultado.txt -Append
          "agente_pretooluse=$(curl.exe -s -w ' http=%{http_code}' --data-binary "@$env:TEMP\pre.json" "$base/PreToolUse")" | Out-File ci\resultado.txt -Append
          # O pedido de permissão fica esperando a decisão: roda em segundo plano e grava a resposta num arquivo.
          $permProc = Start-Process curl.exe -ArgumentList "-s", "-m", "60", "-o", "$env:TEMP\perm-resp.txt", "--data-binary", "@$env:TEMP\perm.json", "$base/PermissionRequest" -PassThru -WindowStyle Hidden
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 900, 700
          Start-Sleep 4
          Shot "21-permissao"
          Click (($w + 620) / 2 - 102) 191
          $null = $permProc.WaitForExit(65000)
          "agente_resposta=$(if (Test-Path "$env:TEMP\perm-resp.txt") { Get-Content "$env:TEMP\perm-resp.txt" -Raw } else { 'nenhuma' })" | Out-File ci\resultado.txt -Append
          Start-Sleep 1
          Shot "22-depois-de-permitir"
          # Modo jogo: botão no topo do notch; fechado vira um risquinho e só abre com 2 s de mouse em cima.
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point ([int]($w / 2)), 10
          Start-Sleep 2
          Click (($w + 620) / 2 - 123) 22
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 900, 700
          Start-Sleep 1
          Shot "18-modo-jogo"
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point ([int]($w / 2)), 2
          Start-Sleep 1
          Shot "19-jogo-1s"
          Start-Sleep 2
          Shot "20-jogo-3s"
          Click (($w + 620) / 2 - 123) 22
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 900, 700
          Start-Sleep 1
          # Arrastar pelas bordas: segura o fundo do notch aberto (ao lado do título) e leva até a borda esquerda.
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point ([int]($w / 2)), 10
          Start-Sleep 2
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point ([int](($w - 620) / 2 + 70)), 22
          Start-Sleep -Milliseconds 300
          [W.M]::mouse_event(0x0002, 0, 0, 0, [System.UIntPtr]::Zero)
          foreach ($pt in @(@(400, 60), @(250, 200), @(100, 330), @(4, 400))) {
            [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point $pt[0], $pt[1]
            Start-Sleep -Milliseconds 250
          }
          Start-Sleep 1
          Shot "16-arrastando"
          [W.M]::mouse_event(0x0004, 0, 0, 0, [System.UIntPtr]::Zero)
          Start-Sleep 1
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 900, 700
          Start-Sleep 1
          Shot "17-na-esquerda"
          "config_depois_de_arrastar=$(Get-Content "$env:APPDATA\Orbi\rust-config.json" -Raw | ConvertFrom-Json | Select-Object edge, edge_pos | ConvertTo-Json -Compress)" | Out-File ci\resultado.txt -Append
          # Notch Compacto (configuração salva no rust-config.json): abre e passa pelas páginas pela seta.
          Get-Process orbi -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 1
          # Também testa a ordem das páginas: Calendário na 2ª bolinha e Copiados escondido (7 páginas).
          '{"compact":true,"pages":[{"id":0,"visible":true},{"id":3,"visible":true},{"id":1,"visible":true},{"id":2,"visible":true},{"id":4,"visible":true},{"id":5,"visible":false},{"id":6,"visible":true},{"id":7,"visible":true}]}' | Set-Content "$env:APPDATA\Orbi\rust-config.json" -Encoding ascii
          New-Item -ItemType Directory run2 -Force | Out-Null
          Copy-Item target\release\orbi.exe run2\orbi.exe
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 900, 700
          $p3 = Start-Process run2\orbi.exe -ArgumentList "--startup" -PassThru
          Start-Sleep 5
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point ([int]($w / 2)), 10
          Start-Sleep 2
          Shot "c0-compacto"
          foreach ($i in 1..6) { Click (($w + 544) / 2 - 22) 116; Shot "c$i-compacto" }
          "compacto_vivo=$(-not $p3.HasExited)" | Out-File ci\resultado.txt -Append
          if (-not $p3.HasExited) { Stop-Process $p3 -Force }
          Shot "14-atualizado"
          if (Test-Path "$env:APPDATA\Orbi\rust-erro.log") { Copy-Item "$env:APPDATA\Orbi\rust-erro.log" ci\erro.log }
          if (Test-Path "$env:APPDATA\Orbi\rust-diag.txt") { Copy-Item "$env:APPDATA\Orbi\rust-diag.txt" ci\diag.txt }
          if (Test-Path "$env:APPDATA\Orbi\rust-agentes.log") { Copy-Item "$env:APPDATA\Orbi\rust-agentes.log" ci\agentes.log }
          if (-not $p.HasExited) { Stop-Process $p -Force }
          # O resultado é conferido no passo "Falhar se fechou"; o código de saída do último curl não conta.
          exit 0

      - name: Guardar prints no branch ci-results-rust
        shell: bash
        run: |
          cd ci
          git init -q -b ci-results-rust && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "rust ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results-rust

      - name: Falhar se fechou
        shell: pwsh
        run: |
          if (-not (Select-String -Path ci\resultado.txt -Pattern 'vivo=True' -Quiet)) { exit 1 }
          if (Test-Path ci\erro.log) { Get-Content ci\erro.log; exit 1 }
          if (Select-String -Path ci\resultado.txt -Pattern '^(com|sem)_album=0$' -Quiet) { Write-Error "não achou a letra no LRCLIB"; exit 1 }
          if (-not (Select-String -Path ci\resultado.txt -Pattern 'agente_resposta=.*"behavior":"allow"' -Quiet)) { Write-Error "o Permitir do notch não voltou para o Claude Code"; exit 1 }

      - name: Instalador
        timeout-minutes: 10
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $env:ORBI_VERSION = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Instala em silêncio e confere que o Orbi foi para a pasta do usuário.
          # Espera só o instalador (com -Wait o PowerShell esperaria também o Orbi que ele abre no fim).
          $setup = Start-Process dist\OrbiRustSetup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          if (-not $setup.WaitForExit(180000)) { Write-Error "instalador travou"; exit 1 }
          $installed = "$env:LOCALAPPDATA\Programs\Orbi Rust\OrbiRust.exe"
          Start-Sleep 3
          Get-Process OrbiRust -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path $installed)) { Write-Error "não instalou"; exit 1 }

      - name: Publicar a prévia
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/release/orbi.exe Orbi-rust.exe
          echo "$GITHUB_SHA" > versao.txt
          cp dist/OrbiRustSetup.exe OrbiRustSetup.exe
          # A etiqueta aponta para o main: o GitHub recusa (às vezes como erro 500) criar etiqueta num commit
          # cujos arquivos de workflow diferem dos do main, o que acontece quando chega um push novo no meio.
          for i in 1 2 3; do
            # O .exe sobe antes do versao.txt: quem vê a versão nova já encontra o .exe novo.
            gh release upload rust-preview Orbi-rust.exe OrbiRustSetup.exe --clobber && gh release upload rust-preview versao.txt --clobber && exit 0
            gh release create rust-preview Orbi-rust.exe OrbiRustSetup.exe versao.txt --target main --prerelease --title "Orbi em Rust (preview)" \
              --notes "Preview da versao em Rust. Nao substitui o Orbi atual: baixe e abra o Orbi-rust.exe para testar." && exit 0
            sleep $((i * 10))
          done
          exit 1
