name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Versão
        shell: pwsh
        run: |
          $v = (Select-Xml -Path Orbi.csproj -XPath '//Version').Node.InnerText
          "ORBI_VERSION=$v" >> $env:GITHUB_ENV

      - name: Teste da detecção de batida
        run: dotnet run --project tests

      - name: Publicar
        run: dotnet publish Orbi.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Teste rápido (abre o Orbi, passa o mouse no notch e tira prints)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory ci -Force | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("ci\$name.png")
          }
          $p = Start-Process publish\Orbi.exe -PassThru
          Start-Sleep 15
          Shot "1-configuracoes"
          $w = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point ([int]($w / 2)), 8
          Start-Sleep 3
          Shot "2-notch-aberto"
          try {
            Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
            function Find($name) {
              $c = New-Object System.Windows.Automation.PropertyCondition ([System.Windows.Automation.AutomationElement]::NameProperty), $name
              [System.Windows.Automation.AutomationElement]::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $c)
            }
            $av = Find "Avatar do Orbi"
            1..9 | ForEach-Object { $av.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); Start-Sleep -Milliseconds 150 }
            Start-Sleep 1
            Shot "3-avatar-cutucado"
            (Find "Calendário").GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
            Start-Sleep 1
            Shot "4-calendario"
            function Tab($name, $shot) {
              (Find $name).GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
              Start-Sleep 2
              Shot $shot
            }
            Set-Clipboard -Value "Texto copiado no teste do CI"
            Start-Sleep 1
            Tab "Área de transferência" "6-area-transferencia"
            Tab "Sistema" "7-sistema"
            Tab "Notas" "8-notas"
            Tab "Bandeja" "9-bandeja"
          } catch { "UIA: $_" | Out-File ci\uia.txt }
          # Bug do Alt+Tab: tira o "sempre por cima" do notch e confere se ele volta sozinho.
          Add-Type @"
          using System; using System.Runtime.InteropServices; using System.Text;
          public static class W {
            public delegate bool CB(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(CB cb, IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern int GetWindowLong(IntPtr h, int i);
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr h, IntPtr a, int x, int y, int cx, int cy, uint f);
            public static IntPtr Notch(uint pid) {
              IntPtr found = IntPtr.Zero;
              EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p);
                if (p == pid && (GetWindowLong(h, -20) & 0x80) != 0) found = h; return true; }, IntPtr.Zero);
              return found;
            }
          }
          "@
          $h = [W]::Notch([uint32]$p.Id)
          [W]::SetWindowPos($h, [IntPtr](-2), 0, 0, 0, 0, 0x13) | Out-Null
          $lost = ([W]::GetWindowLong($h, -20) -band 8) -eq 0
          Start-Sleep 3
          $back = ([W]::GetWindowLong($h, -20) -band 8) -ne 0
          "perdeu=$lost voltou=$back" | Out-File ci\topmost.txt
          if (-not $back) { "notch não voltou para cima" | Out-File ci\erros.log -Append }
          "vivo=$(-not $p.HasExited)" | Out-File ci\resultado.txt
          $log = "$env:APPDATA\Orbi\erros.log"
          if (Test-Path $log) { Copy-Item $log ci\erros.log }
          if (-not $p.HasExited) { Stop-Process $p -Force }
          # Notch na lateral esquerda: hora em pé, notch fino.
          Set-Content "$env:APPDATA\Orbi\edge.txt" "Left 0.5"
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 900, 700
          $p2 = Start-Process publish\Orbi.exe -ArgumentList "--startup" -PassThru
          Start-Sleep 10
          Shot "5-lateral"
          if (Test-Path $log) { Copy-Item $log ci\erros.log -Force }
          if (-not $p2.HasExited) { Stop-Process $p2 -Force }

      - name: Guardar o resultado do teste no branch ci-results
        shell: bash
        run: |
          cd ci
          git init -q -b ci-results && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "teste ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results

      - name: Falhar se o Orbi fechou ou registrou erro
        shell: pwsh
        run: if ((Get-Content ci\resultado.txt) -ne 'vivo=True' -or (Test-Path ci\erros.log)) { exit 1 }

      - name: Instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Publicar no Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$ORBI_VERSION" dist/OrbiSetup.exe --title "Orbi $ORBI_VERSION" --notes "Baixe o OrbiSetup.exe e abra para instalar." \
            || gh release upload "v$ORBI_VERSION" dist/OrbiSetup.exe --clobber
